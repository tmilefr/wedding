<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fiche invité</title>
<link rel="stylesheet" href="/style.css">
<style>
  .fiche { max-width: 820px; }
  .fiche .top { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .fiche h1 { margin: 0; font-size: 1.9rem; }
  .kv { display: grid; grid-template-columns: 13rem 1fr; gap: .4rem 1rem; margin: 0; }
  .kv dt { font-weight: 700; color: var(--foret); }
  .kv dd { margin: 0; white-space: pre-line; }
  .linkrow { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; }
  .linkrow img { width: 110px; height: 110px; }
  .linkrow code { word-break: break-all; font-size: .9rem; }
  .editrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: .6rem; align-items: end; }
  .editrow label { font-size: .88rem; font-weight: 700; color: var(--doux); display: block; }
  @media (max-width: 600px) { .kv { grid-template-columns: 1fr; } .editrow { grid-template-columns: 1fr; } }
  @media print { .adm > :not(.fiche-print) { display: none !important; } .fiche-print { display: block !important; } .noprint { display: none !important; } }
</style>
</head>
<body>
<div class="adm fiche">
  <div class="top noprint"><a href="/admin">← Retour à la liste</a><button class="btn ghost small" onclick="window.print()">Imprimer la fiche</button> <button class="btn ghost small" onclick="fetch('/api/admin/logout',{method:'POST'}).then(()=>location.href='/admin/login')">Se déconnecter</button></div>
  <div class="fiche-print" id="fiche">Chargement…</div>
</div>
<script src="/admin-guest.js"></script>
</body>
</html>
