<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Espace des mariés</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="adm">
  <header>
    <h1>Espace des mariés</h1>
    <div class="toolbar">
      <a class="btn" href="/admin/envois">Envoyer les invitations</a>
      <a class="btn ghost" href="/api/admin/export.xlsx" download>Télécharger l'Excel</a>
      <button class="btn ghost" id="printCards">Imprimer les cartes QR</button>
    </div>
  </header>

  <section class="tiles" id="tiles" aria-label="Chiffres clés"></section>

  <section class="panel">
    <div class="toolbar" style="margin-bottom:.8rem">
      <h2 style="margin:0">Invités</h2>
      <span class="grow"></span>
      <label class="sr" for="filter">Rechercher</label>
      <input type="text" id="filter" placeholder="Rechercher un invité" style="max-width:240px">
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Invité</th><th>Statut</th><th>Personnes</th><th>Couchages</th><th>Réponse</th><th>Lien</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p id="empty" class="muted" hidden>Aucun invité pour l'instant. Ajoutez-les depuis l'écran <a href="/admin/envois">Envoyer les invitations</a>.</p>
  </section>

  <section class="cards" id="cards" aria-hidden="true"></section>
</div>
<script src="/admin.js"></script>
</body>
</html>
